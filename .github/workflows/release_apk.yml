name: Release Signed OmniScreen Android APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android_agent
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode Release Keystore (if configured)
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Signed Release APK
        if: steps.keystore.outputs.signed == 'true'
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk OmniScreenAgent-release.apk

      - name: Fallback Debug APK (when release secrets not yet set)
        if: steps.keystore.outputs.signed != 'true'
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk OmniScreenAgent-release.apk

      - name: Cleanup Temporary Keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Generate SHA-256 Checksum
        run: sha256sum OmniScreenAgent-release.apk > OmniScreenAgent-release.apk.sha256

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniScreenAgent-release
          path: |
            android_agent/OmniScreenAgent-release.apk
            android_agent/OmniScreenAgent-release.apk.sha256

      - name: Publish GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android_agent/OmniScreenAgent-release.apk
            android_agent/OmniScreenAgent-release.apk.sha256
          generate_release_notes: true
